server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # URLs curtas (sem .html), mantendo os arquivos originais acessiveis
    location = /tic  { try_files /decidir-tic.html  =404; }
    location = /base { try_files /decidir-base.html =404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
